<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Atlas</title>
<meta name="theme-color" content="#14061f">
<meta name="description" content="A navigation app with a game-style look: missions, a garage and a car on your map.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen map. Top stack (search or turn banner, mission timer, clock and cash),
     radar bottom-left, controls bottom-right, route card at the very bottom, big splash in the middle. */
  :root {
    --ink: #14110f;
    --accent: #f2b705;
    --accent2: #f2b705;
    --route: #e8363d;
    --panel: rgba(20,17,15,.88);
    --panel-line: rgba(255,255,255,.16);
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --body: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
    --stack: 12px;
  }
  body.vice {
    --ink: #14061f;
    --accent: #ff4fa3;
    --accent2: #ff9a3c;
    --route: #19e3d4;
    --panel: linear-gradient(135deg, rgba(52,12,84,.93), rgba(10,22,54,.93));
    --panel-line: rgba(255,120,200,.4);
  }
  body.has-wp { --stack: 160px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); overscroll-behavior: none; }
  body { font-family: var(--body); color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #map { position: absolute; inset: 0; background: #b9a98a; }
  body.vice #map { background: #1b0f33; }

  /* Map look: CSS filters on the tile panes (main map and radar) */
  .leaflet-tile-pane { transition: filter .4s; }
  body.atlas .leaflet-tile-pane { filter: sepia(.45) saturate(.95) hue-rotate(-6deg) contrast(1.12) brightness(.93); }
  body.vice .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(1.2) saturate(.9); }
  #wash, #glow, #vig { position: absolute; inset: 0; pointer-events: none; }
  #wash { z-index: 450; opacity: 0; transition: opacity .4s; mix-blend-mode: color;
    background: linear-gradient(165deg, #ff2d95 0%, #7a2cff 45%, #00e5d0 100%); }
  #glow { z-index: 451; opacity: 0; transition: opacity .4s; mix-blend-mode: screen;
    background: radial-gradient(120% 80% at 50% 110%, rgba(255,90,170,.45), transparent 60%); }
  #vig { z-index: 452; box-shadow: inset 0 0 120px rgba(0,0,0,.45); }
  body.vice #wash { opacity: .85; }
  body.vice #glow { opacity: 1; }

  .hud { position: absolute; z-index: 1000; }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* Top stack */
  #topstack { top: max(12px, var(--sa-t)); left: max(12px, var(--sa-l)); right: max(12px, var(--sa-r)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #topstack > * { pointer-events: auto; }
  #search { position: relative; display: flex; background: var(--panel); border: 2px solid var(--panel-line); border-radius: 2px; }
  #q { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: 600 20px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 12px; outline: none; -webkit-user-select: text; user-select: text; }
  #q::placeholder { color: rgba(255,255,255,.5); }
  #go { border: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #14061f; font: 400 22px var(--display); letter-spacing: .06em; padding: 0 16px; cursor: pointer; }
  #results { position: absolute; top: 100%; left: -2px; right: -2px; margin-top: 4px; background: var(--panel); border: 2px solid var(--panel-line); max-height: 40vh; overflow: auto; }
  #results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--panel-line); color: #fff; font: 500 18px var(--body); padding: 10px 12px; cursor: pointer; }
  #results button:hover, #results button:focus-visible { background: rgba(255,255,255,.1); outline: none; }
  #results small { display: block; opacity: .6; font-size: 14px; }

  #banner { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 2px solid var(--panel-line); border-left: 8px solid var(--accent); padding: 10px 14px; }
  #bArrow { flex: none; width: 56px; height: 56px; color: var(--accent2); display: grid; place-items: center; }
  #bArrow svg { width: 100%; height: 100%; fill: currentColor; transition: transform .25s; }
  #banner .meta { min-width: 0; }
  #bDist { font: 400 40px/1 var(--display); letter-spacing: .04em; color: var(--accent2); font-variant-numeric: tabular-nums; }
  #bText { font: 700 22px/1.1 var(--body); overflow-wrap: anywhere; }
  #bRoad { font: 500 16px var(--body); opacity: .7; margin-top: 2px; overflow-wrap: anywhere; }

  #row2 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
  #timer, #chip { background: var(--panel); border: 2px solid var(--panel-line); padding: 4px 10px; display: flex; align-items: baseline; gap: 8px; }
  #timer span { font: 600 14px var(--body); letter-spacing: .14em; opacity: .75; }
  #timer b { font: 400 30px/1 var(--display); letter-spacing: .06em; color: var(--accent2); font-variant-numeric: tabular-nums; }
  #chip { margin-left: auto; }
  #clock { font: 600 18px var(--body); letter-spacing: .08em; opacity: .85; font-variant-numeric: tabular-nums; }
  #cash { font: 400 26px/1 var(--display); letter-spacing: .05em; color: #8dff9b; font-variant-numeric: tabular-nums; }
  #hint { background: var(--panel); border-left: 6px solid var(--accent); padding: 8px 12px; font: 500 17px var(--body); transition: opacity .6s; pointer-events: none; }
  #hint.gone { opacity: 0; }

  /* Controls */
  #side { right: max(12px, var(--sa-r)); bottom: calc(var(--stack) + var(--sa-b)); display: flex; flex-direction: column; gap: 6px; transition: bottom .2s; }
  .btn { width: 48px; height: 48px; background: var(--panel); border: 2px solid var(--panel-line); color: #fff; font: 400 26px var(--display); cursor: pointer; border-radius: 2px; display: grid; place-items: center; padding: 0; }
  .btn:active, .btn[aria-pressed="true"] { background: var(--accent); color: #14061f; }
  .btn svg { width: 26px; height: 26px; }
  #radar { left: max(12px, var(--sa-l)); bottom: calc(var(--stack) + var(--sa-b)); width: 118px; height: 118px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.5); pointer-events: none; isolation: isolate; transform: translateZ(0); transition: bottom .2s; background: #1b0f33; }
  #radar i { position: absolute; left: 50%; top: 50%; width: 18px; height: 22px; margin: -11px 0 0 -9px; background: var(--accent2); clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%); z-index: 1000; }

  /* Route card */
  #wp { left: max(12px, var(--sa-l)); right: max(12px, var(--sa-r)); bottom: calc(12px + var(--sa-b)); background: var(--panel); border: 2px solid var(--panel-line); border-left: 8px solid var(--accent); padding: 10px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 14px; align-items: center; }
  #wp .name { font: 400 28px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; overflow-wrap: anywhere; }
  #wp .sub { font: 500 17px var(--body); opacity: .75; margin-top: 2px; overflow-wrap: anywhere; }
  #wp .stat { text-align: right; font: 400 30px/1 var(--display); color: var(--accent2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #wp .stat small { display: block; font: 500 15px var(--body); color: #fff; opacity: .7; letter-spacing: .06em; }
  #wp .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .act { background: none; border: 2px solid var(--panel-line); color: #fff; font: 400 20px var(--display); letter-spacing: .08em; padding: 8px 16px; cursor: pointer; }
  .act.main { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; color: #14061f; }
  .only-mission { display: none; }
  body.mission .only-mission { display: inline-block; }
  body.mission .only-preview { display: none; }

  /* Mission splash */
  #splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; text-align: center; pointer-events: none; opacity: 0; padding: 20px; background: radial-gradient(90% 60% at 50% 50%, rgba(20,6,31,.72), rgba(20,6,31,0) 70%); }
  #splash.show { animation: pop 3s ease both; }
  #splash .t { font: 400 clamp(54px, 17vw, 128px)/.92 var(--display); letter-spacing: .04em; background: linear-gradient(180deg, #fff3a6 0%, #ffb23c 42%, #ff3d8f 88%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(0,0,0,.5)); text-wrap: balance; }
  #splash .s { margin-top: 10px; font: 700 clamp(20px, 5.5vw, 34px)/1.1 var(--body); letter-spacing: .1em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.8); overflow-wrap: anywhere; }
  @keyframes pop { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 82% { opacity: 1; } 100% { opacity: 0; transform: scale(.97); } }
  #toast { left: 50%; transform: translateX(-50%); bottom: calc(var(--stack) + var(--sa-b) + 130px); background: var(--panel); border: 2px solid var(--panel-line); padding: 8px 14px; font: 600 17px var(--body); white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }

  /* Garage sheet */
  #garage { left: 0; right: 0; bottom: 0; z-index: 1100; background: var(--panel); border-top: 3px solid var(--accent); padding: 14px max(14px, var(--sa-r)) calc(14px + var(--sa-b)) max(14px, var(--sa-l)); }
  #garage h2 { margin: 0 0 10px; font: 400 32px/1 var(--display); letter-spacing: .08em; }
  #cars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { display: flex; align-items: center; gap: 12px; min-width: 0; text-align: left; background: rgba(255,255,255,.06); border: 2px solid var(--panel-line); color: #fff; padding: 10px; cursor: pointer; }
  .card[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,255,255,.14); }
  .card .prev { flex: none; width: 40px; height: 80px; }
  .card svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.55)); }
  .card b { display: block; font: 400 24px/1.05 var(--display); letter-spacing: .05em; }
  .card small { display: block; font: 500 15px/1.2 var(--body); opacity: .72; margin-top: 3px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
  .row .label { font: 500 16px var(--body); letter-spacing: .1em; opacity: .7; text-transform: uppercase; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--panel-line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #fff; }
  .spacer { flex: 1; }
  @media (max-width: 420px) { #cars { grid-template-columns: 1fr; } }

  /* Markers */
  .car { position: relative; width: 26px; height: 52px; }
  .car b { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; border: 3px solid var(--accent); animation: ping 1.8s ease-out infinite; }
  .car-rot { position: absolute; inset: 0; }
  .car-rot svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
  @keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .flag { width: 26px; height: 26px; background: var(--accent); border: 3px solid var(--ink); transform: rotate(45deg); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion: reduce) {
    .car b { animation: none; opacity: .5; }
    .leaflet-tile-pane, #hint, #bArrow svg { transition: none; }
    #splash.show { animation: fade 3s ease both; }
    @keyframes fade { 0%, 100% { opacity: 0; } 12%, 82% { opacity: 1; } }
  }
  .leaflet-control-attribution { font: 500 11px var(--body); background: rgba(0,0,0,.55) !important; color: #ddd; margin-bottom: 0; }
  .leaflet-control-attribution a { color: #fff; }
  /* Landscape phones: compact HUD, radar hidden, cards kept to the left so the buttons stay free */
  @media (max-height: 520px) {
    #radar, #hint { display: none; }
    #topstack { right: auto; width: min(560px, calc(100% - 90px)); }
    #bArrow { width: 40px; height: 40px; }
    #bDist { font-size: 30px; }
    #bText { font-size: 18px; }
    #banner { padding: 6px 12px; gap: 10px; }
    #wp { right: auto; width: min(560px, calc(100% - 90px)); padding: 6px 12px; gap: 4px 10px; }
    #wp .name { font-size: 22px; }
    #wp .stat { font-size: 24px; }
    .act { padding: 5px 12px; font-size: 18px; }
    .btn { width: 40px; height: 40px; }
    .btn svg { width: 22px; height: 22px; }
    #side { gap: 4px; }
    body.has-wp { --stack: 12px; }
    #garage { max-height: 100%; overflow: auto; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body class="vice">
<div id="map"></div>
<div id="wash"></div><div id="glow"></div><div id="vig"></div>

<div id="topstack" class="hud">
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="Enter an address" aria-label="Enter an address">
    <button id="go" type="submit">GO</button>
    <div id="results" hidden></div>
  </form>
  <div id="banner" hidden>
    <div id="bArrow"></div>
    <div class="meta">
      <div id="bDist">--</div>
      <div id="bText"></div>
      <div id="bRoad"></div>
    </div>
  </div>
  <div id="row2">
    <div id="timer" hidden><span>MISSION</span><b id="tval">00:00</b></div>
    <div id="chip"><span id="clock">--:--</span><b id="cash">$0</b></div>
  </div>
  <div id="hint">Enter an address to start a mission. Tap the map to preview a route. Hold the map to park your car.</div>
</div>

<div id="radar" class="hud" aria-hidden="true"><i id="radarArrow"></i></div>

<div id="side" class="hud">
  <button class="btn" id="open-garage" aria-label="Open garage" title="Garage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 20V9l9-6 9 6v11"/><path d="M7 20v-6h10v6"/></svg>
  </button>
  <button class="btn" id="style-btn" aria-label="Switch map style" title="Map style">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
  </button>
  <button class="btn" id="voice" aria-label="Voice guidance" aria-pressed="true" title="Voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
  </button>
  <button class="btn" id="locate" aria-label="Use my real location" title="My location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>
</div>

<div id="wp" class="hud" hidden>
  <div>
    <div class="name" id="wpName">Destination</div>
    <div class="sub" id="wpSub"></div>
  </div>
  <div class="stat" id="wpStat"></div>
  <div class="actions">
    <button class="act main only-preview" id="start" hidden>START MISSION</button>
    <button class="act" id="demo" hidden>DEMO DRIVE</button>
    <button class="act only-preview" id="clear">CLEAR</button>
    <button class="act only-mission" id="abort">ABORT</button>
  </div>
</div>

<div id="splash" aria-live="polite"><div class="t"></div><div class="s"></div></div>
<div id="toast" class="hud" hidden></div>

<section id="garage" class="hud" hidden aria-label="Garage">
  <h2>GARAGE</h2>
  <div id="cars"></div>
  <div class="row"><span class="label">Paint</span><span id="swatches" class="row" style="margin:0"></span></div>
  <div class="row">
    <button class="act" id="park">PARK HERE</button>
    <button class="act" id="install" hidden>INSTALL APP</button>
    <span class="spacer"></span>
    <button class="act main" id="close-garage">DONE</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var HOME = [51.9158, 5.0003]; // Meerkerk, the default parking spot
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;

  /*PURE-START*/
  function hav(a, b) {
    var R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function bearing(a, b) {
    var r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
    var x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  var COMPASS = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  function compass(deg) { return COMPASS[Math.round((((deg % 360) + 360) % 360) / 45) % 8]; }
  function sayStep(s) {
    var m = s.maneuver || {}, t = m.type, mod = m.modifier || '', name = s.name || '', onto = name ? ' onto ' + name : '';
    var side = mod.replace(/^(slight |sharp )/, '');
    switch (t) {
      case 'depart': return 'Head ' + (typeof m.bearing_after === 'number' ? compass(m.bearing_after) : 'out') + (name ? ' on ' + name : '');
      case 'arrive': return (mod === 'left' || mod === 'right') ? 'Arrive at your destination on the ' + mod : 'Arrive at your destination';
      case 'roundabout': case 'rotary': return 'At the roundabout take exit ' + (m.exit || 1) + onto;
      case 'roundabout turn': return 'At the roundabout turn ' + mod + onto;
      case 'exit roundabout': case 'exit rotary': return 'Exit the roundabout' + onto;
      case 'merge': return 'Merge ' + (mod || 'ahead') + onto;
      case 'on ramp': return 'Take the ramp' + (side ? ' on the ' + side : '') + onto;
      case 'off ramp': return 'Take the exit' + (side ? ' on the ' + side : '') + onto;
      case 'fork': return 'Keep ' + (mod.indexOf('left') > -1 ? 'left' : 'right') + ' at the fork' + onto;
      case 'end of road': return 'At the end of the road turn ' + mod + onto;
      case 'new name': return 'Continue' + onto;
      case 'continue': return (mod === 'straight' || !mod) ? 'Continue straight' + (name ? ' on ' + name : '') : 'Continue ' + mod + onto;
      default:
        if (mod === 'uturn') return 'Make a U-turn' + onto;
        if (mod === 'straight' || !mod) return 'Continue straight' + (name ? ' on ' + name : '');
        return 'Turn ' + mod + onto;
    }
  }
  var MOD = { 'straight': 0, 'slight right': 45, 'right': 90, 'sharp right': 135, 'uturn': 180, 'sharp left': -135, 'left': -90, 'slight left': -45 };
  function arrowDeg(s) {
    var m = s.maneuver || {};
    if (m.type === 'depart') return 0;
    var d = MOD[m.modifier];
    return d === undefined ? 0 : d;
  }
  function buildNav(route) {
    var coords = route.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
    var cum = [0], i;
    for (i = 1; i < coords.length; i++) cum.push(cum[i - 1] + hav(coords[i - 1], coords[i]));
    var total = cum[cum.length - 1] || 1;
    var raw = (route.legs && route.legs[0] && route.legs[0].steps) || [];
    var sum = raw.reduce(function (a, s) { return a + s.distance; }, 0) || 1, acc = 0;
    var steps = raw.map(function (s) {
      var o = { frac: acc / sum, text: sayStep(s), deg: arrowDeg(s), type: (s.maneuver && s.maneuver.type) || '', name: s.name || '', f300: false, fNow: false };
      acc += s.distance;
      return o;
    });
    if (!steps.length) steps = [{ frac: 1, text: 'Arrive at your destination', deg: 0, type: 'arrive', name: '', f300: false, fNow: false }];
    return { coords: coords, cum: cum, total: total, dur: route.duration, dist: route.distance, steps: steps };
  }
  function snapTo(nav, pos) {
    var c = nav.coords, k = Math.cos(pos[0] * Math.PI / 180), best = Infinity, bi = 0, bt = 0, i;
    var px = pos[1] * k, py = pos[0];
    for (i = 0; i < c.length - 1; i++) {

      var seg = cum[idx + 1] - cum[idx] || 1, f = Math.min(1, Math.max(0, (dd - cum[idx]) / seg));
      var a = pts[idx], b = pts[Math.min(idx + 1, pts.length - 1)];
      var pos = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
      var target = bearing(a, b), diff = ((target - heading + 540) % 360) - 180;
      placeCar(pos, (heading + diff * 0.18 + 360) % 360);
      if (follow) map.setView(pos, map.getZoom(), { animate: false });
      updateNav(pos);
      if (sim) { if (k < 1) raf = requestAnimationFrame(frame); else stopSim(); }
    }
    raf = requestAnimationFrame(frame);
  };

  /* ---------- Search ---------- */
  var results = $('results');
  $('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('q').value.trim();
    if (!q) return;
    document.activeElement && document.activeElement.blur();
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); }).then(function (list) {
        results.innerHTML = '';
        if (!list.length) { results.innerHTML = '<button type="button">No results<small>Try another spelling</small></button>'; results.hidden = false; return; }
        list.forEach(function (it) {
          var parts = it.display_name.split(', ');
          var b = document.createElement('button');
          b.type = 'button';
          b.innerHTML = '<span></span><small></small>';
          b.firstChild.textContent = parts[0];
          b.lastChild.textContent = parts.slice(1, 4).join(', ');
          b.onclick = function () {
            results.hidden = true;
            var ll = L.latLng(+it.lat, +it.lon);
            map.setView(ll, 14);
            setDestination(ll, parts[0], true);
          };
          results.appendChild(b);
        });
        results.hidden = false;
      }).catch(function () {
        results.innerHTML = '<button type="button">Search failed<small>Check your connection</small></button>'; results.hidden = false;
      });
  });

  setTimeout(function () { $('hint').classList.add('gone'); }, 9000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
