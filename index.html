<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Atlas</title>
<meta name="theme-color" content="#14061f">
<meta name="description" content="A navigation app with a game-style look: missions, a garage, car spots and a car on your map.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: full-screen map. Top stack (search or turn banner, mission timer, clock and cash),
     radar bottom-left, controls bottom-right, route card at the very bottom, one menu sheet
     (garage, places, trips, settings) that slides over the lower part of the screen. */
  :root {
    --ink: #14110f;
    --accent: #f2b705;
    --accent2: #f2b705;
    --route: #e8363d;
    --panel: rgba(20,17,15,.88);
    --panel-line: rgba(255,255,255,.16);
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --body: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
    --stack: 12px;
  }
  body.vice {
    --ink: #14061f;
    --accent: #ff4fa3;
    --accent2: #ff9a3c;
    --route: #19e3d4;
    --panel: linear-gradient(135deg, rgba(52,12,84,.95), rgba(10,22,54,.95));
    --panel-line: rgba(255,120,200,.4);
  }
  body.has-wp { --stack: 160px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); overscroll-behavior: none; }
  body { font-family: var(--body); color: #fff; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }
  #map { position: absolute; inset: 0; background: #b9a98a; }
  body.vice #map { background: #1b0f33; }

  .leaflet-tile-pane { transition: filter .4s; }
  body.atlas .leaflet-tile-pane { filter: sepia(.45) saturate(.95) hue-rotate(-6deg) contrast(1.12) brightness(.93); }
  body.vice .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(1.2) saturate(.9); }
  #wash, #glow, #vig { position: absolute; inset: 0; pointer-events: none; }
  #wash { z-index: 450; opacity: 0; transition: opacity .4s; mix-blend-mode: color;
    background: linear-gradient(165deg, #ff2d95 0%, #7a2cff 45%, #00e5d0 100%); }
  #glow { z-index: 451; opacity: 0; transition: opacity .4s; mix-blend-mode: screen;
    background: radial-gradient(120% 80% at 50% 110%, rgba(255,90,170,.45), transparent 60%); }
  #vig { z-index: 452; box-shadow: inset 0 0 120px rgba(0,0,0,.45); }
  body.vice #wash { opacity: .85; }
  body.vice #glow { opacity: 1; }

  .hud { position: absolute; z-index: 1000; }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #topstack { top: max(12px, var(--sa-t)); left: max(12px, var(--sa-l)); right: max(12px, var(--sa-r)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #topstack > * { pointer-events: auto; }
  #search { position: relative; display: flex; background: var(--panel); border: 2px solid var(--panel-line); border-radius: 2px; }
  #q { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: 600 20px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 12px; outline: none; }
  #q::placeholder { color: rgba(255,255,255,.5); }
  #go { border: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #14061f; font: 400 22px var(--display); letter-spacing: .06em; padding: 0 16px; cursor: pointer; }
  #results { position: absolute; top: 100%; left: -2px; right: -2px; margin-top: 4px; background: var(--panel); border: 2px solid var(--panel-line); max-height: 40vh; overflow: auto; }
  #results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--panel-line); color: #fff; font: 500 18px var(--body); padding: 10px 12px; cursor: pointer; }
  #results button:hover, #results button:focus-visible { background: rgba(255,255,255,.1); outline: none; }
  #results small { display: block; opacity: .6; font-size: 14px; }

  #banner { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 2px solid var(--panel-line); border-left: 8px solid var(--accent); padding: 10px 14px; }
  #bArrow { flex: none; width: 56px; height: 56px; color: var(--accent2); display: grid; place-items: center; }
  #bArrow svg { width: 100%; height: 100%; fill: currentColor; transition: transform .25s; }
  #banner .meta { min-width: 0; }
  #bDist { font: 400 40px/1 var(--display); letter-spacing: .04em; color: var(--accent2); font-variant-numeric: tabular-nums; }
  #bText { font: 700 22px/1.1 var(--body); overflow-wrap: anywhere; }
  #bRoad { font: 500 16px var(--body); opacity: .7; margin-top: 2px; overflow-wrap: anywhere; }

  #row2 { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
  #timer, #chip { background: var(--panel); border: 2px solid var(--panel-line); padding: 4px 10px; display: flex; align-items: baseline; gap: 8px; }
  #timer span { font: 600 14px var(--body); letter-spacing: .14em; opacity: .75; }
  #timer b { font: 400 30px/1 var(--display); letter-spacing: .06em; color: var(--accent2); font-variant-numeric: tabular-nums; }
  #chip { margin-left: auto; }
  #clock { font: 600 18px var(--body); letter-spacing: .08em; opacity: .85; font-variant-numeric: tabular-nums; }
  #cash { font: 400 26px/1 var(--display); letter-spacing: .05em; color: #8dff9b; font-variant-numeric: tabular-nums; }
  #hint { background: var(--panel); border-left: 6px solid var(--accent); padding: 8px 12px; font: 500 17px var(--body); transition: opacity .6s; pointer-events: none; }
  #hint.gone { opacity: 0; }

  #side { right: max(12px, var(--sa-r)); bottom: calc(var(--stack) + var(--sa-b)); display: flex; flex-direction: column; gap: 6px; transition: bottom .2s; }
  .btn { position: relative; width: 48px; height: 48px; background: var(--panel); border: 2px solid var(--panel-line); color: #fff; font: 400 26px var(--display); cursor: pointer; border-radius: 2px; display: grid; place-items: center; padding: 0; }
  .btn:active, .btn[aria-pressed="true"] { background: var(--accent); color: #14061f; }
  .btn svg { width: 26px; height: 26px; }
  #menuBtn.dot::after { content: ""; position: absolute; top: 4px; right: 4px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent2); border: 2px solid #fff; }
  #radar { left: max(12px, var(--sa-l)); bottom: calc(var(--stack) + var(--sa-b)); width: 118px; height: 118px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.5); pointer-events: none; isolation: isolate; transform: translateZ(0); transition: bottom .2s; background: #1b0f33; }
  #radar i { position: absolute; left: 50%; top: 50%; width: 18px; height: 22px; margin: -11px 0 0 -9px; background: var(--accent2); clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%); z-index: 1000; }

  #wp { left: max(12px, var(--sa-l)); right: max(12px, var(--sa-r)); bottom: calc(12px + var(--sa-b)); background: var(--panel); border: 2px solid var(--panel-line); border-left: 8px solid var(--accent); padding: 10px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 14px; align-items: center; }
  #wp .name { font: 400 28px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; overflow-wrap: anywhere; }
  #wp .sub { font: 500 17px var(--body); opacity: .75; margin-top: 2px; overflow-wrap: anywhere; }
  #wp .stat { text-align: right; font: 400 30px/1 var(--display); color: var(--accent2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #wp .stat small { display: block; font: 500 15px var(--body); color: #fff; opacity: .7; letter-spacing: .06em; }
  #wp .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .act { background: none; border: 2px solid var(--panel-line); color: #fff; font: 400 20px var(--display); letter-spacing: .08em; padding: 8px 16px; cursor: pointer; }
  .act.main { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; color: #14061f; }
  .act:disabled { opacity: .45; cursor: default; }
  .only-mission { display: none; }
  body.mission .only-mission { display: inline-block; }
  body.mission .only-preview { display: none; }

  #splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; text-align: center; pointer-events: none; opacity: 0; padding: 20px; background: radial-gradient(90% 60% at 50% 50%, rgba(20,6,31,.72), rgba(20,6,31,0) 70%); }
  #splash.show { animation: pop 3.6s ease both; }
  #splash .t { font: 400 clamp(54px, 17vw, 128px)/.92 var(--display); letter-spacing: .04em; background: linear-gradient(180deg, #fff3a6 0%, #ffb23c 42%, #ff3d8f 88%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(0,0,0,.5)); text-wrap: balance; }
  #splash .s { margin-top: 10px; font: 700 clamp(20px, 5.5vw, 34px)/1.15 var(--body); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.8); overflow-wrap: anywhere; }
  @keyframes pop { 0% { opacity: 0; transform: scale(1.6); } 10% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(.97); } }
  #toast { left: 50%; transform: translateX(-50%); bottom: calc(var(--stack) + var(--sa-b) + 130px); background: var(--panel); border: 2px solid var(--panel-line); padding: 8px 14px; font: 600 17px var(--body); max-width: calc(100% - 24px); text-align: center; z-index: 1500; }

  /* Menu sheet */
  #sheet { left: 0; right: 0; bottom: 0; z-index: 1100; background: var(--panel); border-top: 3px solid var(--accent); display: flex; flex-direction: column; max-height: min(84%, 700px); padding-bottom: var(--sa-b); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--panel-line); padding: 0 max(8px, var(--sa-l)); flex: none; }
  .tab { flex: 1 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; color: rgba(255,255,255,.65); font: 400 21px var(--display); letter-spacing: .08em; padding: 12px 12px 9px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
  #sheetBody { overflow: auto; padding: 12px max(14px, var(--sa-r)) 12px max(14px, var(--sa-l)); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 120px; }
  #sheetFoot { flex: none; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 8px max(14px, var(--sa-r)) 8px max(14px, var(--sa-l)); border-top: 1px solid var(--panel-line); }
  .sec { font: 600 15px var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 14px 0 8px; }
  .sec:first-child { margin-top: 0; }
  .muted { opacity: .72; font: 500 16px/1.25 var(--body); }

  /* Garage */
  .gpreview { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .gsprite { flex: none; width: 56px; height: 112px; }
  .gsprite svg, .cspr svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.55)); }
  .ginfo { min-width: 0; flex: 1 1 160px; }
  .ginfo b { display: block; font: 400 32px/1 var(--display); letter-spacing: .05em; }
  .plate { display: inline-flex; align-items: stretch; margin-top: 8px; border: 2px solid #111; border-radius: 4px; overflow: hidden; background: #f6c900; color: #111; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .plate i { font: 700 12px var(--body); font-style: normal; background: #1c46b5; color: #fff; padding: 4px 5px; display: grid; align-items: end; }
  .plate span { font: 700 26px/1 var(--body); letter-spacing: .12em; padding: 4px 10px; min-width: 80px; text-align: center; }
  .swrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--panel-line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #fff; }
  .field { background: rgba(255,255,255,.08); border: 2px solid var(--panel-line); color: #fff; font: 600 20px var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; min-width: 0; width: 170px; max-width: 100%; }
  #carGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .card { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; text-align: left; background: rgba(255,255,255,.06); border: 2px solid var(--panel-line); color: #fff; padding: 10px; cursor: pointer; font-family: var(--body); }
  .card[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,255,255,.14); }
  .card.locked { cursor: default; }
  .cspr { width: 40px; height: 80px; }
  .carGrid.d3 .card { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .carGrid.d3 .cspr { width: 100%; height: 84px; }
  .cspr img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .gshow { flex: none; width: 190px; height: 118px; }
  .gshow canvas { display: block; width: 100%; height: 100%; }
  .card b { display: block; font: 400 23px/1.05 var(--display); letter-spacing: .05em; overflow-wrap: anywhere; }
  .card small { display: block; font: 500 14px/1.2 var(--body); opacity: .72; margin-top: 2px; }
  .state { margin-top: 6px; font: 400 18px var(--display); letter-spacing: .06em; color: var(--accent2); }
  .bar { height: 5px; background: rgba(255,255,255,.15); margin-top: 4px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .buy { margin-top: 6px; padding: 5px 12px; font-size: 18px; }

  /* Places */
  .prow { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--panel-line); }
  .prow.hl { background: rgba(255,255,255,.1); }
  .pbadge { width: 44px; height: 44px; display: grid; place-items: center; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); background: rgba(255,255,255,.14); font: 400 17px var(--display); letter-spacing: .05em; color: rgba(255,255,255,.6); }
  .prow.done .pbadge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #14061f; }
  .pname { font: 700 20px/1.1 var(--body); overflow-wrap: anywhere; }
  .psub { font: 500 15px/1.2 var(--body); opacity: .72; margin-top: 2px; overflow-wrap: anywhere; }
  .pact { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .pact .act { padding: 5px 10px; font-size: 17px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }

  /* Trips */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .tile { background: rgba(255,255,255,.07); border: 2px solid var(--panel-line); padding: 8px 12px; }
  .tile small { display: block; font: 600 14px var(--body); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .tile b { display: block; font: 400 30px/1.1 var(--display); letter-spacing: .04em; color: var(--accent2); font-variant-numeric: tabular-nums; }
  .trow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--panel-line); }
  .trow .tn { font: 700 19px/1.1 var(--body); overflow-wrap: anywhere; }
  .trow .td { font: 500 15px/1.2 var(--body); opacity: .72; }
  .trow .tm { text-align: right; font: 400 22px/1 var(--display); color: #8dff9b; font-variant-numeric: tabular-nums; align-self: center; }

  /* Settings */
  .srow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 0; border-bottom: 1px solid var(--panel-line); }
  .srow > span { font: 600 19px var(--body); letter-spacing: .04em; }
  .seg { display: inline-flex; border: 2px solid var(--panel-line); }
  .seg button { background: none; border: 0; color: rgba(255,255,255,.75); font: 400 20px var(--display); letter-spacing: .08em; padding: 7px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #14061f; }

  /* Markers */
  .car { position: relative; width: 26px; height: 52px; }
  .car b { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; border: 3px solid var(--accent); animation: ping 1.8s ease-out infinite; }
  .car-rot { position: absolute; inset: 0; }
  .car-rot img { display: block; width: 100%; height: 100%; }
  .car-rot svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); }
  @keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .flag { width: 26px; height: 26px; background: var(--accent); border: 3px solid var(--ink); transform: rotate(45deg); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .pin { width: 18px; height: 18px; border: 3px solid var(--accent); background: rgba(0,0,0,.55); transform: rotate(45deg); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .pin.done { background: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .car b { animation: none; opacity: .5; }
    .leaflet-tile-pane, #hint, #bArrow svg { transition: none; }
    #splash.show { animation: fade 3.6s ease both; }
    @keyframes fade { 0%, 100% { opacity: 0; } 10%, 85% { opacity: 1; } }
  }
  .leaflet-control-attribution { font: 500 11px var(--body); background: rgba(0,0,0,.55) !important; color: #ddd; margin-bottom: 0; }
  .leaflet-control-attribution a { color: #fff; }
  .leaflet-tooltip { font: 600 15px var(--body); background: var(--panel); color: #fff; border: 2px solid var(--panel-line); border-radius: 0; box-shadow: none; }
  .leaflet-tooltip-top:before { border-top-color: var(--accent); }

  /* Landscape phones: compact HUD, radar hidden, cards kept to the left so the buttons stay free */
  @media (max-height: 520px) {
    #radar, #hint { display: none; }
    #topstack { right: auto; width: min(560px, calc(100% - 90px)); }
    #bArrow { width: 40px; height: 40px; }
    #bDist { font-size: 30px; }
    #bText { font-size: 18px; }
    #banner { padding: 6px 12px; gap: 10px; }
    #wp { right: auto; width: min(560px, calc(100% - 90px)); padding: 6px 12px; gap: 4px 10px; }
    #wp .name { font-size: 22px; }
    #wp .stat { font-size: 24px; }
    .act { padding: 5px 12px; font-size: 18px; }
    .btn { width: 40px; height: 40px; }
    .btn svg { width: 22px; height: 22px; }
    #side { gap: 4px; }
    body.has-wp { --stack: 12px; }
    #sheet { max-height: 100%; }
    .tab { font-size: 18px; padding: 8px 10px 6px; }
    #toast { bottom: calc(12px + var(--sa-b)); }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body class="vice">
<div id="map"></div>
<div id="wash"></div><div id="glow"></div><div id="vig"></div>

<div id="topstack" class="hud">
  <form id="search" autocomplete="off">
    <input id="q" type="search" data-i18n-ph="searchPh">
    <button id="go" type="submit" data-i18n="go">GO</button>
    <div id="results" hidden></div>
  </form>
  <div id="banner" hidden>
    <div id="bArrow"></div>
    <div class="meta">
      <div id="bDist">--</div>
      <div id="bText"></div>
      <div id="bRoad"></div>
    </div>
  </div>
  <div id="row2">
    <div id="timer" hidden><span data-i18n="mission">MISSION</span><b id="tval">00:00</b></div>
    <div id="chip"><span id="clock">--:--</span><b id="cash">$0</b></div>
  </div>
  <div id="hint" data-i18n="hint"></div>
</div>

<div id="radar" class="hud" aria-hidden="true"><i id="radarArrow"></i></div>

<div id="side" class="hud">
  <button class="btn" id="menuBtn" data-i18n-aria="aMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <button class="btn" id="style-btn" data-i18n-aria="aStyle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
  </button>
  <button class="btn" id="voice" aria-pressed="true" data-i18n-aria="aVoice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
  </button>
  <button class="btn" id="locate" data-i18n-aria="aLocate">

  $('demo').onclick = function () {

    stopWatch(); hasFix = false; manual = true; realPos = false;
    sim = true; follow = true; $('demo').textContent = T('stopDemo');

    placeCar(pts[0], bearing(pts[0], pts[1] || pts[0]));
    map.setView(pts[0], 17, { animate: false });
    var t0 = performance.now(), idx = 0;

      var p = x.p, i = x.i;
      var row = el('div', 'prow' + (i.done ? ' done' : '')); row.setAttribute('data-pid', p.id);
      row.appendChild(el('div', 'pbadge', p.code || 'CS'));
      var t = el('div'); t.appendChild(el('div', 'pname', p.name));
      var sub = (p.city ? p.city + ' · ' : '') + (i.verified ? fmtDist(i.d) : T('locating'));
      t.appendChild(el('div', 'psub', sub));
      if (!i.done && i.verified) {
        var hint = !realPos ? T('needGps') : T('parkToUnlock', { d: fmtDist(p.r) });
        if (!i.canUnlock) t.appendChild(el('div', 'psub', hint));
      }
      row.appendChild(t);
      var act = el('div', 'pact');
      if (i.done) act.appendChild(el('div', 'state', T('unlocked')));
      else {
        var ub = el('button', 'act' + (i.canUnlock ? ' main' : ''), T('unlock')); ub.type = 'button'; ub.disabled = !i.canUnlock; ub.onclick = function () { unlockPlace(p); }; act.appendChild(ub);
      }
      var nb = el('button', 'act', T('navigate')); nb.type = 'button'; nb.onclick = function () { startNavTo(p); }; act.appendChild(nb);
      row.appendChild(act); box.appendChild(row);
    });
    box.appendChild(el('div', 'sec', T('addSpot')));
    var ar = el('div', 'addrow');
    var ni = el('input', 'field'); ni.id = 'spotName'; ni.maxLength = 28; ni.placeholder = T('spotName'); ni.setAttribute('aria-label', T('spotName'));
    ni.onfocus = function () { hlLock = true; }; ni.onblur = function () { hlLock = false; };
    var ab = el('button', 'act', T('addHere')); ab.type = 'button';
    ab.onclick = function () {
      var name = ni.value.trim().slice(0, 28); if (!name) { ni.focus(); return; }
      var id = 'u' + Date.now();
      S.custom.push({ id: id, name: name, city: '', ll: [carPos[0], carPos[1]], r: 150, bonus: 0, code: 'ME', kind: 'custom' });
      S.badges[id] = Date.now(); persist(); syncPlaceMarkers(); toast(T('spotAdded')); hlLock = false; renderTab();
    };
    ar.appendChild(ni); ar.appendChild(ab); box.appendChild(ar);
  }
  function renderStats(box) {
    box.innerHTML = '';
    var tiles = el('div', 'tiles');
    var add = function (label, val) { var t = el('div', 'tile'); t.appendChild(el('small', '', label)); t.appendChild(el('b', '', val)); tiles.appendChild(t); };
    add(T('sDist'), fmtKm(S.totalM));
    add(T('sTime'), S.totalMs ? fmtTime(S.totalMs) : '--');
    add(T('sAvg'), S.totalMs > 0 ? fmtSpeed(avgKmh(S.totalM, S.totalMs)) : '--');
    add(T('sTrips'), String(S.trips.length));
    add(T('sEarned'), fmtMoney(S.earned));
    add(T('sBalance'), fmtMoney(S.cash));
    box.appendChild(tiles);
    box.appendChild(el('div', 'sec', T('sRecent')));
    if (!S.trips.length) box.appendChild(el('div', 'muted', T('sNone')));
    S.trips.slice(0, 15).forEach(function (t) {
      var row = el('div', 'trow');
      var l = el('div'); l.appendChild(el('div', 'tn', t.name));
      var d = new Date(t.t0), p = function (n) { return ('0' + n).slice(-2); };
      l.appendChild(el('div', 'td', p(d.getDate()) + '-' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ' · ' + fmtKm(t.d) + ' · ' + fmtTime(t.ms) + ' · ' + fmtSpeed(avgKmh(t.d, t.ms))));
      row.appendChild(l); row.appendChild(el('div', 'tm', '+' + fmtMoney(t.earned)));
      box.appendChild(row);
    });
  }
  var resetArmed = false;
  function seg(label, opts, cur, onPick) {
    var row = el('div', 'srow'); row.appendChild(el('span', '', label));
    var s = el('div', 'seg');
    opts.forEach(function (o) { var b = el('button', '', o[1]); b.type = 'button'; b.setAttribute('aria-pressed', String(cur === o[0])); b.onclick = function () { onPick(o[0]); }; s.appendChild(b); });
    row.appendChild(s); return row;
  }
  function renderSettings(box) {
    box.innerHTML = '';
    box.appendChild(seg(T('lLang'), [['nl', 'NEDERLANDS'], ['en', 'ENGLISH']], LANG, function (v) { setSetting('lang', v); }));
    box.appendChild(seg(T('lDist'), [['km', 'KM'], ['mi', 'MILES']], UNITS, function (v) { setSetting('dist', v); }));
    box.appendChild(seg(T('lCur'), [['USD', '$ DOLLAR'], ['EUR', '€ EURO']], CUR, function (v) { setSetting('cur', v); }));
    box.appendChild(seg(T('lVoice'), [[true, T('on')], [false, T('off')]], voiceOn, function (v) { voiceOn = v; S.set.voice = v; persist(); syncVoiceBtn(); renderTab(); }));
    var rb = el('button', 'act', T(resetArmed ? 'resetSure' : 'reset')); rb.type = 'button'; rb.style.marginTop = '18px';
    rb.onclick = function () {
      if (!resetArmed) { resetArmed = true; renderTab(); setTimeout(function () { resetArmed = false; if (sheetOpen && curTab === 'settings') renderTab(); }, 4000); return; }
      resetArmed = false;
      try { localStorage.removeItem('atlas-save'); } catch (e) {}
      S = loadSave(); LANG = S.set.lang; UNITS = S.set.dist; CUR = S.set.cur; voiceOn = true;
      Object.keys(placeMarkers).forEach(function (k) { map.removeLayer(placeMarkers[k]); delete placeMarkers[k]; });
      nearNotified = {}; carMarker.setIcon(carIcon()); syncPlaceMarkers(); applyLang(); toast(T('resetDone'));
    };
    box.appendChild(rb);
  }
  function setSetting(k, v) {
    S.set[k] = v; persist();
    LANG = S.set.lang; UNITS = S.set.dist; CUR = S.set.cur;
    applyLang();
  }

  /* ---------- Language ---------- */
  function applyLang() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = T(e.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (e) { e.placeholder = T(e.getAttribute('data-i18n-ph')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (e) { e.setAttribute('aria-label', T(e.getAttribute('data-i18n-aria'))); });
    $('q').setAttribute('aria-label', T('searchPh'));
    $('demo').textContent = T(sim ? 'stopDemo' : 'demo');
    if (wp && $('wpName').textContent && !mission) { /* destination names stay as found */ }
    if (lastB && mission) setBanner(lastB[0], lastB[1], lastB[2]);
    updateStats(); renderCash(); syncVoiceBtn(); syncPlaceMarkers();
    if (sheetOpen) setTab(curTab);
    placeMarkerTips();
  }
  function placeMarkerTips() { allPlaces().forEach(function (p) { var m = placeMarkers[p.id]; if (m && m.getTooltip()) m.setTooltipContent(p.name); }); }

  /* ---------- Start-up ---------- */
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; $('installBtn').hidden = false; });
  $('installBtn').onclick = function () { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; $('installBtn').hidden = true; } };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') persist();
    else if (mission) keepAwake();
  });
  window.addEventListener('pagehide', function () { if (trk.active && !mission) endTrip(); persist(); });

  applyLang();
  syncPlaceMarkers();
  setTimeout(geocodePlaces, 3000);
  window.addEventListener('load', function () { setTimeout(load3D, 400); });
  setTimeout(function () { $('hint').classList.add('gone'); }, 9000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
